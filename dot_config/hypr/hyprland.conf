

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $terminal -e yazi
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, F, exec, firefox
bind = $mainMod, C, exec, code
bind = $mainMod, R, exec, /home/vyrus-extreme/.local/share/JetBrains/Toolbox/scripts/rider
bind = $mainMod, I, exec, /home/vyrus-extreme/.local/share/JetBrains/Toolbox/scripts/idea

# Focus (arrow keys + vim)
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows (arrow keys + vim). movewindow, not swapwindow, so that pushing
# past the edge of a screen carries the window onto the next monitor:
# BenQ is on the left, so SUPER+SHIFT+L sends a window BenQ -> builtin.
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Jump focus to the other monitor
bind = $mainMod, Tab, focusmonitor, +1

bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%s).png

# Headless mode: tap the HP hotkey = all displays dark + mouse/keyboard power cut.
# Tap again to restore. bindl so it still fires with the screens off.
bindl = , XF86Launch2, exec, /home/vyrus-extreme/.local/bin/headless

# Lid switch. This machine doubles as a homeserver node, so it never suspends on
# a lid close -- logind is set to ignore the switch in
# /etc/systemd/logind.conf.d/10-headless.conf, and it lands here instead.
# Closing only drops eDP-1 as an output, so no workspace or new window ends up on
# a panel you cannot see; the externals are left lit and untouched. Deliberately
# unrelated to headless mode above. bindl so it fires with the screens off.
bindl = , switch:on:Lid Switch,  exec, /home/vyrus-extreme/.local/bin/lid close
bindl = , switch:off:Lid Switch, exec, /home/vyrus-extreme/.local/bin/lid open

input {
    kb_layout = pt
}

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = WLR_DRM_NO_ATOMIC,1
env = GBM_BACKEND,nvidia-drm
env = XDG_SESSION_TYPE,wayland
env = WLR_NO_HARDWARE_CURSORS,1
# Dolphin outside Plasma: needed so file associations work (with archlinux-xdg-menu)
env = XDG_MENU_PREFIX,arch-

# BenQ EX2510S = main monitor, physically to the LEFT of the laptop.
# Matched by description (not DP-1) so it works whichever port it's plugged into.
monitor=desc:BNQ BenQ EX2510S K8M02386019,1920x1080@144,0x0,1
monitor=eDP-1,1920x1080@144,1920x0,1
# Stale: nothing is connected to HDMI-A-1 (the BenQ is on DP-1). Left here in case
# you re-add an HDMI display -- note it would collide with the BenQ at 0x0.
# monitor=HDMI-A-1,1920x1080@60,0x0,1

# The one line that makes the BenQ the MAIN screen: workspace 1 (the startup
# workspace) lands there, so that's where you begin and where new windows go.
# Delete this line if you'd rather nothing be pinned at all.
workspace = 1, monitor:desc:BNQ BenQ EX2510S K8M02386019, default:true

exec-once = mako
exec-once = waybar
exec-once = blueman-applet
exec-once = ~/.local/bin/librepods --start-minimized
exec-once = ~/.local/bin/airpods-autoconnect

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(4488ffff)
    col.inactive_border = rgba(1a1a2eff)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

input { touchpad { natural_scroll = no } }

exec-once = sleep 1 && hyprpaper
