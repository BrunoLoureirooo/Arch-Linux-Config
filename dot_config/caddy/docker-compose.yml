# Reverse proxy giving the local services friendly names on port 80.
#
# network_mode: host so Caddy can reach services on the host's loopback:
# Plex (also host-networked, :32400) and gluetun's published qBittorrent
# WebUI (:8080). On a bridge network, 127.0.0.1 would be the container itself.
#
# Caddy binds loopback only - see default_bind in the Caddyfile.

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    network_mode: host
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-./data}:/data
    restart: unless-stopped
