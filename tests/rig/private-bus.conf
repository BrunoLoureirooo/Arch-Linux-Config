<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private session bus for rig tests (qs-run.sh, selftest-qs.sh). Like the stock
     session.conf but with NO service directories: nothing is ever auto-activated on it
     (no portals, no mako, no a11y bus), so a test can only reach what it starts itself,
     and no activated helper can inherit the caller's live WAYLAND_DISPLAY. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
