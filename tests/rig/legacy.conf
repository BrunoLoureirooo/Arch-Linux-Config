# Minimal LEGACY hyprlang config for the rig: stands in for the rollback hyprland.conf so
# scripts that must work under both formats (lid, headless) can be checked against it:
#   tests/rig/nested-hypr.sh start tests/rig/legacy.conf && tests/hypr/lid_headless.sh
monitor = DP-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, 1920x1080@60, 1920x0, 1

animations {
    enabled = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_watchdog_warning = true
}
xwayland {
    enabled = false
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
