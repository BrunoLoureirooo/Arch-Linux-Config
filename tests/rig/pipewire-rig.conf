# Private PipeWire daemon for the rig (tests/rig/fake-pipewire.sh): no hardware, no
# pulse/jack, no session manager. A `default` metadata object and two null sinks, so
# Quickshell's Pipewire.defaultAudioSink and the rail's VOLUME section can be tested
# without the owner's real audio graph. Started with PIPEWIRE_RUNTIME_DIR set to a
# private directory: its socket never replaces the live pipewire-0.
context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    support.dbus = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt     = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = metadata
        args = { metadata.name = default }
    }
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            priority.driver = 20000
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "rig_sink_buds"
            node.description = "Rig AirPods Pro Wireless Stereo Headphones"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "rig_sink_analog"
            node.description = "Built-in Audio Analog Stereo"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
]
